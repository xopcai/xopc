appId: ai.xopc.xopc
productName: xopc

# Workaround for electron-builder 26.x + pnpm compatibility
npmRebuild: false
nodeGypRebuild: false

# Scoped npm name (@xopcai/xopc) would otherwise produce paths like dist/release/@xopcai/*.deb (parent dir missing).
artifactName: ${productName}-${version}-${arch}.${ext}

# electron-updater fetches latest-*.yml from this base URL, then downloads artifacts listed there.
# Example asset URL pattern: https://xopc.ai/api/download/release?tag=v0.0.15&name=xopc-0.0.15-arm64.zip
# (macOS background updates require .zip in the manifest; .dmg is for manual installs.)
# Override at runtime: XOPC_UPDATE_FEED_URL
# Note: electron-builder does NOT auto-publish during CI (--publish never unless ELECTRON_PUBLISH=1).
publish:
  provider: generic
  url: https://xopc.ai/api/download

directories:
  output: dist/release
  # App icons: icon.png (from web/public/logo.svg). electron-builder generates .icns / .ico at package time.
  buildResources: electron/resources

files:
  - out/**/*
  - package.json
  # Gateway UI: `pnpm run build:web` → dist/gateway/static/root (not in esbuild server bundle)
  - dist/gateway/static/root/**/*
  # Built-in skills: bundled SKILL.md files for the agent
  - skills/**/*

extraMetadata:
  main: out/main/index.js

extraResources:
  - from: node_modules/@vscode/ripgrep/bin
    to: bin
    filter:
      - rg
      - rg.exe
  # Playwright Chromium install + CDP (must stay a real package tree; not esbuild-bundled).
  - from: node_modules/playwright-core
    to: playwright-core
  # Chrome extension bridge (sideload copy source; must be real files, not inside app.asar)
  - from: dist/browser-ext
    to: browser-ext
    filter:
      - '**/*'
  - from: electron/resources
    to: resources
    filter:
      - '**/*.png'

protocols:
  - name: xopc
    schemes:
      - xopc

mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: electron/resources/entitlements.mac.plist
  entitlementsInherit: electron/resources/entitlements.mac.plist
  # Required for microphone (TCC). Without this, macOS may block or effectively mute capture in the packaged app.
  extendInfo:
    NSMicrophoneUsageDescription: 'xopc needs microphone access to record voice messages in chat.'
    NSScreenCaptureUsageDescription: 'xopc needs screen recording access for screen capture and vision features.'
  # After Apple Developer ID cert + repo secrets are set (see .github/workflows/electron-build.yml),
  # set to true so CI/local release builds submit to Apple Notary Service.
  notarize: true

win:
  # If you Authenticode-sign NSIS builds, set `publisherName` to that cert's Subject (not the Apple
  # "Developer ID Application: …" string from CSC_*), or desktop updates will fail verification.
  target:
    - nsis

# Avoid combined universal NSIS on multi-arch CI (smaller, clearer per-arch installers).
nsis:
  buildUniversalInstaller: false

linux:
  category: Utility
  target:
    - AppImage
    - deb
