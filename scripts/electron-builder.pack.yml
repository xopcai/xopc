# electron-builder config used when --project <packDir> is set (paths relative to pack dir,
# except `directories.output` which is absolute via env interpolation so artifacts land in
# the repo's dist/release/).
appId: ai.xopc.xopc
productName: xopc

npmRebuild: false
nodeGypRebuild: false

artifactName: ${productName}-${version}-${arch}.${ext}

publish:
  provider: generic
  url: https://xopc.ai/api/download

directories:
  output: ${env.XOPC_ELECTRON_RELEASE_OUTPUT}
  buildResources: _pack-resources/build-resources

beforeBuild: _pack-resources/electron-before-build.cjs

files:
  - '**/*'
  - '!**/*.map'
  # Build-time staging only (extraResources / beforeBuild / mac entitlements). On Windows,
  # pnpm junctions under _pack-resources/ (e.g. playwright-core) break asar extraction.
  - '!_pack-resources/**'

# Gateway bundle runs in a Node subprocess; asar fs adapter overhead on a 19MB require
# slows cold start. Unpacking it (and its sibling templates) puts it on plain disk.
asarUnpack:
  - 'out/server/**'
  - 'node_modules/**'
  - 'dist/electron/extensions/**'
  - 'skills/**'
  # The packaged Electron main process starts a gateway subprocess with ELECTRON_RUN_AS_NODE.
  # Keep the SPA assets on the real filesystem too; Windows is less tolerant of serving
  # many files from app.asar in that subprocess and can otherwise boot to a blank shell.
  - 'dist/gateway/static/root/**'

extraMetadata:
  main: out/main/index.js

extraResources:
  - from: _pack-resources/rg
    to: bin
    filter:
      - rg
      - rg.exe
  # Playwright Chromium install + CDP (must stay a real package tree; not esbuild-bundled).
  # types/ is .d.ts only; lib/vite/ is the Trace Viewer UI we never invoke.
  - from: _pack-resources/playwright-core
    to: playwright-core
    filter:
      - '**/*'
      - '!types/**'
      - '!lib/vite/**'
  # Chrome extension bridge (sideload copy source; must be real files, not inside app.asar)
  - from: _pack-resources/browser-ext
    to: browser-ext
    filter:
      - '**/*'
  - from: _pack-resources/build-resources
    to: resources
    filter:
      - '**/*.png'

protocols:
  - name: xopc
    schemes:
      - xopc

electronFuses:
  # Keep RunAsNode enabled: the packaged desktop starts the gateway subprocess with
  # ELECTRON_RUN_AS_NODE until it moves to utilityProcess or a standalone Node runtime.
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

# Limit Chromium UI locales (file dialogs, context menus) to the ones xopc supports.
# Names must match Electron's packaged locale `.pak` basenames. Using `en` / `zh_CN`
# leaves Windows packaged installs with an empty `locales/` directory, which makes
# Chromium fail locale resource lookup during renderer startup.
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW

mac:
  icon: icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: '__XOPC_ELECTRON_ENTITLEMENTS__'
  entitlementsInherit: '__XOPC_ELECTRON_ENTITLEMENTS__'
  extendInfo:
    NSMicrophoneUsageDescription: 'xopc needs microphone access to record voice messages in chat.'
    NSScreenCaptureUsageDescription: 'xopc needs screen recording access for screen capture and vision features.'
  notarize: true

win:
  icon: icon.ico
  target:
    - nsis

nsis:
  buildUniversalInstaller: false

linux:
  icon: icon.png
  category: Utility
  target:
    - AppImage
    - deb
