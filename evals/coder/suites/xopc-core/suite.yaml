      "id": "R01-price-comparison",
      "title": "R01-price-comparison",
      "repo": {
        "source": "local",
        "path": "${EVAL_FIXTURE_REPO}",
        "commit": "${EVAL_FIXTURE_COMMIT}"
      },
      "task": "Read sources.json. Compare ASR cost for 120 minutes. result.json fields: vendorACents, vendorBCents, cheaper (a or b), sourceIds (primary sources used), asOf (source date). Write result.json with exactly the requested fields and a human-readable report.md explaining your result and limitations. Use only the frozen local inputs; do not use network access. Preserve all input files. Do not claim live vendor prices. ",
      "budget": {
        "timeoutMs": 300000,
        "maxModelRequests": 40,
        "maxTokens": 300000
      },
      "tags": [
        "research",
        "frozen",
        "direct-agent"
      ],
      "graders": [
        {
          "type": "command",
          "command": "node .xopc-eval-hidden/check.mjs R01-price-comparison",
          "hiddenFiles": [
            {
              "source": "hidden/check.mjs",
              "target": ".xopc-eval-hidden/check.mjs"
            }
          ]
        },
        {
          "type": "unchanged",
          "paths": [
            "sources.json",
            "sales.csv",
            "quoted.csv",
            "invoice.json",
            "retry-source.mjs"
          ]
        }
      ]
