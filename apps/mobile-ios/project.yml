name: XopcMobile

options:
  bundleIdPrefix: ai.xopc
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  XopcMobile:
    type: application
    platform: iOS
    sources:
      - path: XopcMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.xopc.xopc
        MARKETING_VERSION: 0.0.80
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: xopc
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: true
        INFOPLIST_KEY_NSCameraUsageDescription: "用于拍摄并发送给助手的图片。"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "用于录制语音消息和语音笔记。"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  XopcMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: XopcMobileTests
    dependencies:
      - target: XopcMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.xopc.xopc.tests
        GENERATE_INFOPLIST_FILE: true
  XopcMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: XopcMobileUITests
    dependencies:
      - target: XopcMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.xopc.xopc.uitests
        GENERATE_INFOPLIST_FILE: true

schemes:
  XopcMobile:
    build:
      targets:
        XopcMobile: all
        XopcMobileTests: [test]
        XopcMobileUITests: [test]
    test:
      targets:
        - XopcMobileTests
        - XopcMobileUITests
