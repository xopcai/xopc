name: XopcMobile

options:
  bundleIdPrefix: ai.xopc
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true

packages:
  SwiftDraw:
    url: https://github.com/swhitty/SwiftDraw.git
    exactVersion: 0.9.6

targets:
  XopcMobile:
    type: application
    platform: iOS
    dependencies:
      - target: XopcShareExtension
      - package: SwiftDraw
    sources:
      - path: Shared
      - path: XopcMobile
        excludes: [Resources/Math, Resources/Charts]
      - path: XopcMobile/Resources/Math
        type: folder
        buildPhase: resources
      - path: XopcMobile/Resources/Charts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.xopc.xopc
        PROVISIONING_PROFILE_SPECIFIER: $(XOPC_MAIN_PROFILE_UUID)
        CODE_SIGN_ENTITLEMENTS: $(XOPC_APP_ENTITLEMENTS)
        XOPC_APP_ENTITLEMENTS: XopcMobile/XopcMobile.entitlements
        XOPC_APNS_ENTITLEMENT: production
        XOPC_APNS_ENVIRONMENT: disabled
        MARKETING_VERSION: 0.0.135
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: XopcMobile/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: xopc
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: true
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "授权后，助手可在 xopc 前台使用当前位置查询天气或附近地点。"
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "授权后，助手可在 xopc 前台读取指定时间范围内的日历事件。"
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: "确认后，助手可以创建日程。"
        INFOPLIST_KEY_NSContactsUsageDescription: "授权后，助手可以在 xopc 前台按姓名查找联系人。"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "授权后，助手可读取可访问的照片，并在你确认后将照片加入相册。"
        INFOPLIST_KEY_NSCameraUsageDescription: "用于拍摄并发送给助手的图片。"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "用于实时语音、语音助手、语音消息和语音笔记。"
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          XOPC_APNS_ENTITLEMENT: development
  XopcShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.xopc.xopc.share
        PROVISIONING_PROFILE_SPECIFIER: $(XOPC_SHARE_PROFILE_UUID)
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: ShareExtension/Info.plist
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        MARKETING_VERSION: 0.0.135
        CURRENT_PROJECT_VERSION: 1
  XopcMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: XopcMobileTests
    dependencies:
      - target: XopcMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.xopc.xopc.tests
        GENERATE_INFOPLIST_FILE: true
  XopcMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: XopcMobileUITests
    dependencies:
      - target: XopcMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.xopc.xopc.uitests
        GENERATE_INFOPLIST_FILE: true

schemes:
  XopcMobile:
    build:
      targets:
        XopcMobile: all
        XopcMobileTests: [test]
        XopcMobileUITests: [test]
    test:
      targets:
        - XopcMobileTests
        - XopcMobileUITests
