<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Gateway 连接预览</title>
  <style>
    :root { color-scheme: light dark; font: 15px system-ui; } body { margin: 32px auto; padding: 0 24px; max-width: 680px; }
    h1 { font-size: 24px; } p { line-height: 1.6; } label { display: block; margin-top: 16px; } input { box-sizing: border-box; width: 100%; padding: 9px; margin-top: 5px; }
    button { padding: 9px 14px; margin: 12px 8px 0 0; cursor: pointer; } li { margin: 12px 0; overflow-wrap: anywhere; } #error { color: #e75454; } small { opacity: .75; }
    button:focus-visible, input:focus-visible { outline: 2px solid Highlight; outline-offset: 2px; }
    .desktop-actions { margin: 12px 0; padding: 12px; border: 1px solid GrayText; border-radius: 8px; }
    .desktop-actions p { margin: 0 0 8px; } .desktop-actions button { min-height: 44px; margin-top: 0; }
    button:disabled { cursor: default; opacity: .55; }
  </style>
</head>
<body>
  <h1>Gateway 连接预览</h1>
  <p>选择配置不发起网络请求。显式连接后核验身份并打开远端聊天。本机能力需要单独授权，不启动本地 Gateway。</p>
  <p id="status" role="status"></p><p id="error" role="alert"></p>
  <ul id="profiles"></ul>
  <form id="login-update" hidden>
    <h2>更新登录凭据</h2><p id="login-target"></p>
    <p>更新聊天和管理登录，保留已有电脑登记。</p>
    <label>新的管理凭据<input id="login-credential" type="password" maxlength="8192" required autocomplete="new-password"></label>
    <button type="submit">保存登录凭据</button><button type="button" id="login-cancel">取消</button>
  </form>
  <form id="profile-form">
    <label>连接名称<input id="name" maxlength="80" required autocomplete="off"></label>
    <label>Gateway origin<input id="origin" maxlength="2048" placeholder="https://gateway.example.com" required autocomplete="off"></label>
    <label>传输方式</label>
    <button type="button" id="direct" aria-pressed="true">HTTPS</button><button type="button" id="ssh" aria-pressed="false">已有 SSH loopback 转发</button>
    <label>管理凭据（可留空；仅加密保存）<input id="credential" type="password" maxlength="8192" autocomplete="new-password"></label>
    <button type="submit">保存连接配置</button>
  </form>
  <p><small>SSH 转发仍属于远端模式。选择配置不代表服务器身份、凭据或协议已通过验证。</small></p>
  <p id="observation-status" role="status">本机只读能力未授权。</p><button id="observation-stop" type="button">立即停止本机只读能力</button>
  <p id="execution-status" role="status">本机写入未授权。</p><button id="execution-stop" type="button">立即停止本机执行</button>
  <button id="local-operation-list" type="button">停止并查看本机遗留操作</button><ul id="local-operation-reviews"></ul><p id="local-operation-note" role="status"></p>
  <section id="operation-review-panel" hidden><h2>待核实的本机操作</h2><p>原结果保持未知，旧操作不会重做。检查实际效果后，可独立批准新的意图。</p><ul id="operation-reviews"></ul><p id="operation-review-note" role="status"></p></section>
  <button id="local">使用原本地模式（重启应用）</button><button id="quit">退出预览</button>
  <script src="./gateway-connections.js"></script>
</body>
</html>
