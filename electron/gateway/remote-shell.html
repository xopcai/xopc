<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>xopc · 远端聊天</title><link rel="stylesheet" href="/shell.css"></head><body>
<header><div><h1>远端聊天</h1><p id="verified">正在核验身份</p><small id="details"></small></div><nav><button id="logout">退出此连接</button><button id="recover">返回连接配置</button></nav></header>
<p class="boundary">Agent、会话和工具在服务器运行。本机文件、终端、浏览器控制和设备能力不可用。</p>
<div class="layout"><aside><button id="new">新对话</button><h2>服务器会话</h2><div id="sessions"></div><h2 id="draft-title" hidden>本连接草稿</h2><div id="drafts"></div><details><summary>新对话设置</summary><h2>Agent</h2><div id="agents"></div><h2>模型</h2><div id="models"></div><h2>思考强度</h2><div id="thinking"></div></details></aside>
<main><div class="connection"><span id="status" role="status">连接中</span><button id="verify" hidden>核实上次输入</button></div><p id="notice" role="alert"></p>
<nav aria-label="历史记录翻页"><button id="older" disabled>更早记录</button><button id="latest" hidden>回到最新消息</button></nav><div id="messages" aria-label="聊天记录"></div><div id="skeleton" class="skeleton" aria-label="正在同步"><i></i><i></i><i></i></div>
<form id="composer"><label for="input">消息</label><textarea id="input" rows="3" maxlength="8192" placeholder="发送给服务器上的 Agent…"></textarea><footer><span id="stop-state" role="status"></span><button id="stop" type="button" disabled>停止服务器运行</button><button id="send" class="primary" disabled>发送</button></footer></form></main></div><script src="/shell.js"></script></body></html>
