<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'">
<title>xopc Pin</title>
<style>
  *, *::before, *::after { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  }
  #pin-frame {
    position: relative; width: 100%; height: 100%;
    border: 1.5px solid rgba(7, 193, 96, 0.78);
    border-radius: 4px; overflow: hidden;
    background: #111317; cursor: grab;
  }
  #pin-frame:active { cursor: grabbing; }
  #pin-img { width: 100%; height: 100%; object-fit: fill; display: block; pointer-events: none; }
  #pin-bar {
    position: absolute; top: 6px; right: 6px;
    display: flex; align-items: center; gap: 3px;
    padding: 3px 5px; border-radius: 7px;
    background: rgba(22, 24, 29, 0.88); backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.16);
    opacity: 0; transition: opacity 0.15s ease;
  }
  #pin-frame:hover #pin-bar { opacity: 1; }
  .pin-btn {
    appearance: none; border: none; background: transparent; color: #e5e7eb;
    height: 24px; min-width: 24px; padding: 0 5px; border-radius: 5px;
    font-size: 11px; font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .pin-btn:hover { background: rgba(255,255,255,0.15); color: #ffffff; }
  .pin-btn.danger:hover { background: rgba(239,68,68,0.25); color: #fca5a5; }
  #pin-hud {
    position: absolute; bottom: 6px; left: 6px; pointer-events: none;
    padding: 2px 7px; border-radius: 5px; font-size: 11px; color: #f9fafb;
    background: rgba(17, 19, 23, 0.82); opacity: 0; transition: opacity 0.15s ease;
    font-variant-numeric: tabular-nums;
  }
  #pin-hud.visible { opacity: 1; }
</style>
</head>
<body>
  <div id="pin-frame">
    <img id="pin-img" alt="" />
    <div id="pin-bar"></div>
    <div id="pin-hud"></div>
  </div>
</body>
</html>
