name: Feature request
description: Suggest a new capability or product improvement
title: "[Feature]: "
labels: ["type:enhancement", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and the outcome you want. For small fixes, a bug report may be more appropriate.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain are you trying to solve? Who is affected?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like xopc to behave?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or designs you thought about

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Agent / tools / memory
        - Gateway / APIs
        - Web console (UI)
        - CLI / TUI
        - Electron desktop
        - Channels (Telegram, WeChat, Feishu, …)
        - Sessions / transcripts
        - Providers / models
        - Configuration
        - Extensions / SDK
        - Skills
        - Voice (STT/TTS)
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this

  - type: checkboxes
    id: roadmap
    attributes:
      label: Scope
      options:
        - label: This is a larger initiative (multi-release / architectural)
