name: Native iOS TestFlight

on:
  push:
    tags:
      - "mobile-ios-v*"
  workflow_dispatch:
    inputs:
      version:
        description: App version (x.y.z); must match apps/mobile-ios/project.yml
        required: false
        default: ""
        type: string
      upload:
        description: Upload the signed IPA to TestFlight
        required: true
        default: true
        type: boolean

concurrency:
  group: mobile-native-ios-testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.release.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve release version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          declared_version="$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*\([0-9][0-9.]*\)[[:space:]]*$/\1/p' apps/mobile-ios/project.yml)"
          if [[ ! "$declared_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unable to read one native iOS version from apps/mobile-ios/project.yml" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#mobile-ios-v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            version="$declared_version"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use x.y.z format" >&2
            exit 1
          fi
          if [[ "$version" != "$declared_version" ]]; then
            echo "Release version $version does not match project version $declared_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install native iOS tools
        run: brew install xcodegen swiftformat swiftlint
      - name: Check formatting
        working-directory: apps/mobile-ios
        run: swiftformat XopcMobile XopcMobileTests XopcMobileUITests --lint
      - name: Check Swift code
        working-directory: apps/mobile-ios
        run: swiftlint lint --strict --config .swiftlint.yml
      - name: Generate Xcode project
        working-directory: apps/mobile-ios
        run: xcodegen generate
      - name: Verify generated project is committed
        run: git diff --exit-code -- apps/mobile-ios/XopcMobile.xcodeproj/project.pbxproj
      - name: Run unit tests
        working-directory: apps/mobile-ios
        run: |
          xcodebuild \
            -project XopcMobile.xcodeproj \
            -scheme XopcMobile \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:XopcMobileTests \
            CODE_SIGNING_ALLOWED=NO \
            test

  build:
    needs: [prepare, quality]
    runs-on: macos-26
    timeout-minutes: 60
    env:
      IOS_VERSION: ${{ needs.prepare.outputs.version }}
      IOS_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/mobile-ios
        run: xcodegen generate

      - name: Install App Store Connect API key
        id: app_store_key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          if [[ -z "$API_KEY" || -z "$PRIVATE_KEY_BASE64" ]]; then
            echo "Missing App Store Connect API key secrets" >&2
            exit 1
          fi
          key_dir="$HOME/.appstoreconnect/private_keys"
          key_path="$key_dir/AuthKey_${API_KEY}.p8"
          mkdir -p "$key_dir"
          printf '%s' "$PRIVATE_KEY_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Install existing iOS distribution signing assets
        id: signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_MAIN_BASE64 }}
        run: |
          for value in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD PROFILE_BASE64 APPLE_TEAM_ID; do
            if [[ -z "${!value}" ]]; then
              echo "Missing GitHub secret value: $value" >&2
              exit 1
            fi
          done

          keychain_path="$RUNNER_TEMP/xopc-native-ios.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate_path="$RUNNER_TEMP/xopc-distribution.p12"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path" || \
            echo "Warning: key partition list update returned non-zero; continuing after certificate import"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -E 'Apple Distribution|iPhone Distribution'

          profile_path="$RUNNER_TEMP/main.mobileprovision"
          profile_plist="$RUNNER_TEMP/main-profile.plist"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(plutil -extract UUID raw -o - "$profile_plist")"
          application_identifier="$(plutil -extract Entitlements.application-identifier raw -o - "$profile_plist")"
          test "$application_identifier" = "$APPLE_TEAM_ID.ai.xopc.xopc"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"
          cp "$profile_path" "$profile_dir/$profile_uuid.mobileprovision"
          echo "profile_uuid=$profile_uuid" >> "$GITHUB_OUTPUT"

      - name: Archive and export signed IPA
        working-directory: apps/mobile-ios
        env:
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          archive_path="$RUNNER_TEMP/XopcMobile.xcarchive"
          export_path="$RUNNER_TEMP/xopc-native-ios-export"
          options_path="$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild \
            -project XopcMobile.xcodeproj \
            -scheme XopcMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            "MARKETING_VERSION=$IOS_VERSION" \
            "CURRENT_PROJECT_VERSION=$IOS_BUILD_NUMBER" \
            "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID" \
            'CODE_SIGN_IDENTITY=Apple Distribution' \
            archive

          python3 -c 'import os, plistlib, sys; plistlib.dump({"method": "app-store-connect", "signingStyle": "manual", "teamID": os.environ["APPLE_TEAM_ID"], "signingCertificate": "Apple Distribution", "provisioningProfiles": {"ai.xopc.xopc": os.environ["PROFILE_UUID"]}, "stripSwiftSymbols": True, "manageAppVersionAndBuildNumber": False}, open(sys.argv[1], "wb"))' "$options_path"
          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$options_path"
          ipa_path="$(find "$export_path" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          mkdir -p dist
          cp "$ipa_path" dist/xopc-ios.ipa

      - name: Verify signed IPA
        working-directory: apps/mobile-ios
        run: |
          ipa_path="dist/xopc-ios.ipa"
          verify_path="$RUNNER_TEMP/xopc-native-ios-verify"
          test -s "$ipa_path"
          unzip -tq "$ipa_path"
          mkdir -p "$verify_path"
          ditto -x -k "$ipa_path" "$verify_path"
          app_path="$(find "$verify_path/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv "$app_path" 2> "$RUNNER_TEMP/native-ios-codesign.txt"
          grep -F "TeamIdentifier=$APPLE_TEAM_ID" "$RUNNER_TEMP/native-ios-codesign.txt"
          info_path="$app_path/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info_path")" = "ai.xopc.xopc"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info_path")" = "$IOS_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$info_path")" = "$IOS_BUILD_NUMBER"
          test -f "$app_path/PrivacyInfo.xcprivacy"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: xopc-native-ios-${{ needs.prepare.outputs.version }}-${{ needs.prepare.outputs.build_number }}
          path: apps/mobile-ios/dist/xopc-ios.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload IPA to TestFlight
        if: github.event_name == 'push' || inputs.upload
        working-directory: apps/mobile-ios
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER }}
        run: |
          if [[ -z "$API_KEY" || -z "$API_ISSUER" ]]; then
            echo "Missing App Store Connect API credentials" >&2
            exit 1
          fi
          xcrun altool --validate-app -f dist/xopc-ios.ipa -t ios \
            --api-key "$API_KEY" --api-issuer "$API_ISSUER"
          xcrun altool --upload-app -f dist/xopc-ios.ipa -t ios \
            --api-key "$API_KEY" --api-issuer "$API_ISSUER"
