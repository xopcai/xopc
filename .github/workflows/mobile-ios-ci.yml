name: Mobile iOS CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "apps/mobile-ios/**"
      - "scripts/apps/mobile-native/**"
      - "package.json"
      - "packages/markdown-math/**"
      - "packages/chart-spec/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-ios-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "apps/mobile-ios/**"
      - "scripts/apps/mobile-native/**"
      - "package.json"
      - "packages/markdown-math/**"
      - "packages/chart-spec/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/mobile-ios-ci.yml"

permissions:
  contents: read

concurrency:
  group: mobile-ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install native iOS tools
        run: brew install xcodegen swiftformat swiftlint
      - name: Check formatting
        working-directory: apps/mobile-ios
        run: swiftformat XopcMobile XopcMobileTests XopcMobileUITests --lint
      - name: Check Swift code
        working-directory: apps/mobile-ios
        run: swiftlint lint --strict --config .swiftlint.yml
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26.12.1
          cache: pnpm
      - name: Generate local math resources and Xcode project
        run: pnpm install --frozen-lockfile && pnpm run mobile:ios:generate
      - name: Verify generated project is committed
        run: git diff --exit-code -- apps/mobile-ios/XopcMobile.xcodeproj/project.pbxproj
      - name: Run unit tests
        working-directory: apps/mobile-ios
        env:
          # Match the simulator runtime installed on the macos-26 image.
          DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
        run: |
          # Wait for CoreSimulator to register devices before asking Xcode to run tests.
          devices="$(xcrun simctl list devices available --json)"
          simulator_id="$(jq -r '[.devices["com.apple.CoreSimulator.SimRuntime.iOS-26-5"][]? | select(.name == "iPhone 17 Pro")][0].udid // empty' <<< "$devices")"
          if [[ -z "$simulator_id" ]]; then
            xcrun simctl list runtimes
            xcrun simctl list devices available
            echo "::error::No available iPhone 17 Pro simulator for iOS 26.5."
            exit 1
          fi
          xcrun simctl bootstatus "$simulator_id" -b
          xcodebuild \
            -project XopcMobile.xcodeproj \
            -scheme XopcMobile \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -only-testing:XopcMobileTests \
            CODE_SIGNING_ALLOWED=NO \
            test
