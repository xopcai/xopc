name: Mobile HarmonyOS CI

on:
  workflow_dispatch:
    inputs:
      sign_test_hap:
        description: Sign an encrypted debug HAP for registered test devices only
        type: boolean
        default: false
      release_channel:
        description: Verify the release signature or submit to an AppTest group
        type: choice
        default: none
        options: [none, verify, internal, external]
      expected_version:
        description: Exact AppScope versionName for verify or release
        type: string
      external_group:
        description: Existing external AppTest group name (external only)
        type: string
      resume_package_id:
        description: Huawei package ID from a previous interrupted run (optional)
        type: string
      resume_version_id:
        description: Huawei test version ID from a previous interrupted run (optional)
        type: string
  push:
    branches: [main, master]
    paths:
      - "apps/mobile-harmony/**"
      - "packages/gateway-contract/**"
      - "src/**"
      - "package.json"
      - "packages/markdown-math/**"
      - "packages/chart-spec/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-harmony-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "apps/mobile-harmony/**"
      - "packages/gateway-contract/**"
      - "src/**"
      - "package.json"
      - "packages/markdown-math/**"
      - "packages/chart-spec/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/mobile-harmony-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.release_channel != 'none' && 'mobile-harmony-release' || format('mobile-harmony-ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.release_channel == 'none' }}

jobs:
  host-checks:
    name: Contracts, tests and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26.12.1
          cache: pnpm
      - name: Check release inputs
        if: github.event_name == 'workflow_dispatch' && inputs.release_channel != 'none'
        env:
          RELEASE_REF: ${{ github.ref }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          EXTERNAL_GROUP: ${{ inputs.external_group }}
        run: |
          node --input-type=commonjs <<'NODE'
          const app = JSON.parse(require('node:fs').readFileSync('apps/mobile-harmony/AppScope/app.json5', 'utf8')).app;
          if (process.env.RELEASE_REF !== 'refs/heads/main' || app.versionName !== process.env.EXPECTED_VERSION) {
            throw new Error('Select main and set expected_version to the exact AppScope versionName.');
          }
          if (process.env.RELEASE_CHANNEL === 'external' && !process.env.EXTERNAL_GROUP.trim()) {
            throw new Error('Specify the existing external AppTest group.');
          }
          NODE
      - run: pnpm install --frozen-lockfile
      - name: Check AppTest retry and audience safeguards
        env:
          HUAWEI_AGC_ACCESS_TOKEN: mock-token
        run: node --test apps/mobile-harmony/tests/releaseAgcTest.test.mjs
      - run: pnpm run harmony:verify --host-only

  native-build:
    name: API 23+ HAP and APP (SDK 26)
    needs: host-checks
    # Vendor download credentials must never be exposed to pull-request code.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: harmony-testing
    timeout-minutes: 45
    env:
      HARMONY_TOOLS_SHA256: d53802c52d3d0a6a0836333c9e8f2bb73d9f6753d1658185539e2659c46df1ad
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26.12.1
      - uses: pnpm/action-setup@v5
      - run: pnpm install --frozen-lockfile
      - name: Download verified Huawei command-line tools 26.0.0.821 (macOS ARM64)
        env:
          HARMONY_TOOLS_URL: ${{ secrets.HARMONY_TOOLS_URL }}
          HARMONY_TOOLS_DIR: ${{ runner.temp }}/command-line-tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          if [ -z "$HARMONY_TOOLS_URL" ]; then
            echo '::error::Set the HARMONY_TOOLS_URL repository secret to the official Huawei download URL.'
            exit 1
          fi
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 1800 --silent --show-error \
            "$HARMONY_TOOLS_URL" --output "$RUNNER_TEMP/harmony-tools.zip"
          echo "$HARMONY_TOOLS_SHA256  $RUNNER_TEMP/harmony-tools.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/harmony-tools.zip" -d "$RUNNER_TEMP"
          rm -- "$RUNNER_TEMP/harmony-tools.zip"
          "$HARMONY_TOOLS_DIR/bin/ohpm" --version
          "$HARMONY_TOOLS_DIR/bin/hvigorw" --version
          echo "HARMONY_TOOLS_DIR=$HARMONY_TOOLS_DIR" >> "$GITHUB_ENV"
      - name: Install HarmonyOS dependencies
        working-directory: apps/mobile-harmony
        run: |
          "$HARMONY_TOOLS_DIR/bin/ohpm" install --all
          git diff --exit-code -- oh-package-lock.json5
      - name: Build and lint native preview
        run: node apps/mobile-harmony/scripts/build-ci.mjs
      - uses: actions/setup-java@v5
        if: github.event_name == 'workflow_dispatch' && (inputs.sign_test_hap || inputs.release_channel != 'none')
        with:
          distribution: temurin
          java-version: '17'
      - name: Sign and encrypt test-only HAP
        if: github.event_name == 'workflow_dispatch' && inputs.sign_test_hap
        env:
          HARMONY_TEST_KEY_ALIAS: ${{ secrets.HARMONY_TEST_KEY_ALIAS }}
          HARMONY_TEST_STORE_PASSWORD: ${{ secrets.HARMONY_TEST_STORE_PASSWORD }}
          HARMONY_TEST_KEY_PASSWORD: ${{ secrets.HARMONY_TEST_KEY_PASSWORD }}
          HARMONY_TEST_KEYSTORE_BASE64: ${{ secrets.HARMONY_TEST_KEYSTORE_BASE64 }}
          HARMONY_TEST_PROFILE_BASE64: ${{ secrets.HARMONY_TEST_PROFILE_BASE64 }}
          HARMONY_TEST_CERT_BASE64: ${{ secrets.HARMONY_TEST_CERT_BASE64 }}
          HARMONY_TEST_ARTIFACT_KEY: ${{ secrets.HARMONY_TEST_ARTIFACT_KEY }}
        run: node apps/mobile-harmony/scripts/sign-test-hap.mjs
      - name: Upload encrypted test package
        if: github.event_name == 'workflow_dispatch' && inputs.sign_test_hap
        uses: actions/upload-artifact@v4
        with:
          name: harmony-api23plus-test-encrypted-${{ github.sha }}
          path: |
            apps/mobile-harmony/.test/ci/xopc-test-signed.hap.enc
            apps/mobile-harmony/.test/ci/signed-build-info.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload unsigned build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harmony-api23plus-unsigned-${{ github.sha }}
          path: |
            apps/mobile-harmony/.test/ci/*-unsigned.hap
            apps/mobile-harmony/.test/ci/*-unsigned.app
            apps/mobile-harmony/.test/ci/build-info.json
            apps/mobile-harmony/.test/ci/code-linter.json
          if-no-files-found: error
          retention-days: 14
      - name: Explain installation boundary
        if: github.event_name != 'workflow_dispatch' || inputs.release_channel == 'none'
        shell: bash
        run: |
          echo '### HarmonyOS development preview' >> "$GITHUB_STEP_SUMMARY"
          echo 'Minimum HarmonyOS 6.1 / API 23; target and compile SDK 26. Unsigned Debug/Release HAP and Release APP; build evidence, not phone-install links.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Physical-device installation requires an appropriate Huawei signing profile. Phone-only distribution uses the Huawei testing channel after signing and its checks.' >> "$GITHUB_STEP_SUMMARY"
      - name: Sign and verify the release APP
        if: github.event_name == 'workflow_dispatch' && inputs.release_channel != 'none'
        env:
          HARMONY_RELEASE_SIGNING_JSON: ${{ secrets.HARMONY_RELEASE_SIGNING_JSON }}
        run: node apps/mobile-harmony/scripts/sign-release-app.mjs apps/mobile-harmony/.test/ci "$RUNNER_TEMP/xopc-harmony-test-release.app"
      - name: Verify or submit the Huawei AppTest release
        if: github.event_name == 'workflow_dispatch' && inputs.release_channel != 'none'
        env:
          HUAWEI_AGC_SERVICE_ACCOUNT_JSON: ${{ secrets.HUAWEI_AGC_SERVICE_ACCOUNT_JSON }}
          HARMONY_RELEASE_CHANNEL: ${{ inputs.release_channel }}
          HARMONY_RELEASE_EXPECTED_VERSION: ${{ inputs.expected_version }}
          HARMONY_RELEASE_GROUP: ${{ inputs.external_group }}
          HARMONY_RESUME_PACKAGE_ID: ${{ inputs.resume_package_id }}
          HARMONY_RESUME_VERSION_ID: ${{ inputs.resume_version_id }}
        run: node apps/mobile-harmony/scripts/release-agc-test.mjs apps/mobile-harmony/.test/ci/build-info.json "$RUNNER_TEMP/xopc-harmony-test-release.app"
      - name: Remove the temporary signed APP
        if: always() && github.event_name == 'workflow_dispatch' && inputs.release_channel != 'none'
        run: rm -f -- "$RUNNER_TEMP/xopc-harmony-test-release.app"
