name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint -- .

      - name: Type Check
        run: pnpm run typecheck

      - name: CLI bootstrap import guard
        run: pnpm run test:startup:imports

  architecture:
    name: Architecture Check (dependency-cruiser)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Enforces the 25 SOLID rules in `.dependency-cruiser.cjs`. Errors block
      # the build; the remaining circular-import warnings (intentional, tracked
      # tech debt) do not. Reviewer notes are surfaced in PULL_REQUEST_TEMPLATE.md.
      - name: Architecture check (depcheck)
        run: pnpm run depcheck

  react-doctor:
    name: React Doctor (web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Need history so `--diff` can compare against the base branch on PRs.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PR: scan only changed files vs base branch — fast feedback, blocks regressions.
      # Push to main: full scan — surface drift in the dashboard.
      # Run from web/ so react-doctor.config.json is loaded (repo-root --project skips it).
      - name: Run react-doctor (PR diff)
        if: github.event_name == 'pull_request'
        run: pnpm -C web run react-doctor:pr origin/${{ github.base_ref }}

      - name: Run react-doctor (full scan)
        if: github.event_name != 'pull_request'
        run: pnpm -C web run react-doctor:ci

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Skip build:types — lint-and-typecheck already runs tsc --noEmit; CI only needs JS + web.
      - name: Build
        run: pnpm run build:ci

      - name: Run tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build:ci

      - name: Verify build output
        run: |
          test -d dist || (echo "Build output missing!" && exit 1)
          echo "✅ Build verified"

      - name: CLI startup benchmark
        run: pnpm run test:startup:bench:check

      - name: Gateway startup benchmark
        run: pnpm run test:startup:gateway:check
