name: Skills Test

on:
  push:
    paths:
      - '.github/workflows/skills-test.yml'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'skills/**'
      - 'src/agent/skills/**'
      - 'src/cli/commands/skills*.ts'
  pull_request:
    paths:
      - '.github/workflows/skills-test.yml'
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'skills/**'
      - 'src/agent/skills/**'
      - 'src/cli/commands/skills*.ts'
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test-skills:
    name: Test Skills
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Git to use HTTPS instead of SSH
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Configure Git for HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://".insteadOf "git://"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:ci

      - name: Run skill tests
        shell: bash
        timeout-minutes: 15
        run: |
          echo "Testing skills on ${{ matrix.os }}"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            pnpm run dev -- skills test --format json --skip-examples
          else
            ./scripts/test-skills.sh --verbose
          fi

      - name: Run unit tests for test framework
        timeout-minutes: 5
        run: pnpm vitest run src/agent/skills/__tests__/test-framework.test.ts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skill-test-results-${{ matrix.os }}
          path: |
            test-results/*.json
            *.tap
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Configure Git to use HTTPS instead of SSH
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      
      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Configure Git for HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://".insteadOf "git://"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:ci

      - name: Run security audit
        timeout-minutes: 10
        run: |
          echo "Running security audit on all skills..."
          pnpm run dev -- skills test security --deep
          pnpm audit --prod --audit-level=high

  validate-skill-format:
    name: Validate SKILL.md Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Git to use HTTPS instead of SSH
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Configure Git for HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://".insteadOf "git://"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:ci

      - name: Validate all SKILL.md files
        timeout-minutes: 10
        run: |
          echo "Validating SKILL.md format for all skills..."
          for skill_dir in skills/*/; do
            if [ -f "$skill_dir/SKILL.md" ]; then
              echo "Validating $skill_dir"
              pnpm run dev -- skills test validate "$skill_dir/SKILL.md"
            fi
          done

  check-dependencies:
    name: Check Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Git to use HTTPS instead of SSH
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Configure Git for HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://".insteadOf "git://"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        timeout-minutes: 10
        run: pnpm run build:ci

      - name: Check skill dependencies
        timeout-minutes: 10
        run: |
          echo "Checking skill dependencies..."
          pnpm run dev -- skills test check-deps

  report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [test-skills, security-audit, validate-skill-format, check-dependencies]
    if: always()

    steps:
      - name: Generate report
        run: |
          echo "═══════════════════════════════════════════════════════════"
          echo "              Skills Test Report                          "
          echo "═══════════════════════════════════════════════════════════"
          echo ""
          echo "Test Jobs Status:"
          echo "  - Cross-Platform Tests: ${{ needs.test-skills.result }}"
          echo "  - Security Audit: ${{ needs.security-audit.result }}"
          echo "  - Format Validation: ${{ needs.validate-skill-format.result }}"
          echo "  - Dependency Check: ${{ needs.check-dependencies.result }}"
          echo ""

          # Overall status (all matrix legs and follow-up jobs must succeed)
          TS="${{ needs.test-skills.result }}"
          SA="${{ needs.security-audit.result }}"
          VF="${{ needs.validate-skill-format.result }}"
          CD="${{ needs.check-dependencies.result }}"
          if [[ "$TS" == "success" && "$SA" == "success" && "$VF" == "success" && "$CD" == "success" ]]; then
            echo "✅ All skill test jobs passed!"
          else
            echo "❌ One or more jobs did not succeed (test-skills=$TS security-audit=$SA validate=$VF check-deps=$CD)"
            exit 1
          fi
