name: Mobile Android Release

on:
  push:
    tags:
      - "mobile-android-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6

      - name: Restore existing Production signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_PRODUCTION_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PRODUCTION_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_PRODUCTION_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_PRODUCTION_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing Production signing secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xopc-production.jks"

      - name: Test and build signed native APK and AAB
        working-directory: apps/mobile-android
        env:
          ORG_GRADLE_PROJECT_XOPC_UPLOAD_STORE_FILE: ${{ runner.temp }}/xopc-production.jks
          ORG_GRADLE_PROJECT_XOPC_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_PRODUCTION_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_XOPC_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_PRODUCTION_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_XOPC_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_PRODUCTION_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease

      - name: Verify package and existing Production signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apk=apps/mobile-android/app/build/outputs/apk/release/app-release.apk
          aab=apps/mobile-android/app/build/outputs/bundle/release/app-release.aab
          expected=5F749E9195465B637D4C64D92F871B7CD0B5C5E9D2205E0086F181AFA80D7495
          actual_apk="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          actual_aab="$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':')"
          actual_apk="${actual_apk^^}"
          actual_aab="${actual_aab^^}"
          echo "Expected certificate SHA-256: $expected"
          echo "APK certificate SHA-256: ${actual_apk:-<missing>}"
          echo "AAB certificate SHA-256: ${actual_aab:-<missing>}"
          if [[ "$actual_apk" != "$expected" || "$actual_aab" != "$expected" ]]; then
            echo "::error::Native Android artifacts are not signed by the pinned Production certificate"
            exit 1
          fi
          package_line="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep '^package:')"
          echo "$package_line"
          [[ "$package_line" == *"name='ai.xopc.xopc'"* ]]
          version_code="$(sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" <<< "$package_line")"
          test -n "$version_code" && test "$version_code" -gt 78
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$package_line")"
            test "$version_name" = "${GITHUB_REF_NAME#mobile-android-v}"
          fi

      - name: Prepare release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp apps/mobile-android/app/build/outputs/apk/release/app-release.apk release-assets/xopc-android.apk
          cp apps/mobile-android/app/build/outputs/bundle/release/app-release.aab release-assets/xopc-android.aab
          cd release-assets
          sha256sum xopc-android.apk xopc-android.aab > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: xopc-native-android-production
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30


  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mobile-android-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: xopc-native-android-production
          path: release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Native Android release. Package: `ai.xopc.xopc`.
            Signed with the existing Production Android certificate. Existing Expo app data is not migrated; pair again if needed.
            Verify downloads against `SHA256SUMS`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
