name: Mobile Android Release

on:
  push:
    tags:
      - "mobile-expo-v*"
  workflow_dispatch:
    inputs:
      target:
        description: Android artifact to build
        required: true
        default: both
        type: choice
        options:
          - both
          - apk
          - aab

concurrency:
  group: mobile-android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  EXPO_NO_TELEMETRY: "1"

jobs:
  quality:
    name: Lint, typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint mobile app
        run: pnpm run mobile:lint

      - name: Typecheck mobile app
        run: pnpm run mobile:typecheck

      - name: Test mobile app
        run: pnpm run mobile:test

      - name: Test agent stream client
        run: pnpm run mobile:test:stream

  build:
    name: Build signed Android artifacts
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.target.outputs.value }}
    steps:
      - name: Resolve build target
        id: target
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "value=both" >> "$GITHUB_OUTPUT"
          else
            echo "value=${REQUESTED_TARGET:-both}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "Missing GitHub secret: ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xopc-upload.jks"

      - name: Build Android locally
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/xopc-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/apps/mobile-expo/build-android-release.sh "${{ steps.target.outputs.value }}"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xopc-android-release
          path: apps/mobile-expo/dist/android/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: xopc-android-release
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/xopc-android.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Android install

            Download `xopc-android.apk` and install it on an Android device.

            The signed Android App Bundle is retained as a private workflow artifact for Google Play submission.

            ## Build details

            - Build host: GitHub Actions Ubuntu runner
            - Tag: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
