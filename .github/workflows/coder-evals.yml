name: Coder Evals

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'
  pull_request:
    paths:
      - 'evals/coder/**'
      - 'evals/personal/style/**'
      - 'src/gateway/hono/routes/status.ts'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/coder-evals.yml'
      - '.github/workflows/coder-evals-live.yml'
  push:
    branches: [main, master]
    paths:
      - 'evals/coder/**'
      - 'evals/personal/style/**'
      - 'src/gateway/hono/routes/status.ts'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/coder-evals.yml'
      - '.github/workflows/coder-evals-live.yml'

permissions:
  contents: read

jobs:
  control-plane:
    name: Control plane (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run eval:coder:check

  smoke:
    name: Deterministic smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run eval:coder:smoke
      - name: Check Personal style adapter (no model calls)
        run: pnpm run eval:personal:style:check
      - name: Calibrate xopc benchmark v1 (no model calls)
        run: pnpm run eval:benchmark --output .xopc-evals/ci-core-v1
      - name: Upload xopc benchmark calibration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xopc-core-v1-calibration
          path: .xopc-evals/ci-core-v1/
          if-no-files-found: ignore
          retention-days: 14
