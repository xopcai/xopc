# Publish @xopcai/xopc to npm and ghcr.io/xopcai/xopc when a version tag is pushed.
# npm uses Trusted Publishing (GitHub Actions OIDC); GHCR uses GITHUB_TOKEN.

name: npm Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      exists: ${{ steps.release.outputs.exists }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate release and check npm
        id: release
        run: node scripts/npm-release-preflight.mjs

  tests:
    needs: preflight
    if: needs.preflight.outputs.exists != 'true'
    uses: ./.github/workflows/test-suite.yml

  build:
    needs: preflight
    if: needs.preflight.outputs.exists != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build package including declarations
        run: pnpm run build
      - name: Run skills regression tests
        run: pnpm run test:skills:regression
      - name: Validate publish manifest
        run: pnpm run release:check-package
      - name: Pack verified build
        id: pack
        run: |
          test -s dist/src/index.d.ts
          test -s dist/src/extensions/sdk/index.d.ts
          test -s dist/src/cli/bin.js
          test -s dist/gateway/static/root/index.html
          mkdir -p release-package
          pnpm pack --out release-package/xopc.tgz
          echo "sha256=$(sha256sum release-package/xopc.tgz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package-${{ github.sha }}
          path: release-package/xopc.tgz
          overwrite: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [preflight, tests, build]
    if: >-
      ${{ !cancelled() && needs.preflight.result == 'success' &&
          (needs.preflight.outputs.exists == 'true' ||
           (needs.tests.result == 'success' && needs.build.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v8
        if: needs.preflight.outputs.exists != 'true'
        with:
          name: npm-package-${{ github.sha }}
          path: release-package
      - name: Verify and publish the built tarball
        if: needs.preflight.outputs.exists != 'true'
        env:
          PACKAGE_SHA256: ${{ needs.build.outputs.sha256 }}
          NPM_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          test -n "$PACKAGE_SHA256"
          echo "$PACKAGE_SHA256  release-package/xopc.tgz" | sha256sum --check
          pnpm publish release-package/xopc.tgz --ignore-scripts --no-git-checks --tag "$NPM_TAG" --access public
      - name: Confirm existing npm version
        if: needs.preflight.outputs.exists == 'true'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: npm view "@xopcai/xopc@${VERSION}" version dist.tarball

  docker:
    name: Docker (${{ matrix.arch }})
    needs: [preflight, publish]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' &&
          needs.preflight.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Build candidate image by digest
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.arch }},mode=max
      - name: Test candidate image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: bash scripts/docker-release-smoke.sh "$IMAGE" "$VERSION"
      - name: Record tested digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          echo "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ github.sha }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*.txt
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  docker-manifest:
    name: Publish Docker manifest
    needs: docker
    if: ${{ !cancelled() && needs.docker.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: docker-digest-${{ github.sha }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Publish tested architectures
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          METADATA: ${{ steps.meta.outputs.json }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            digest="$(cat "$RUNNER_TEMP/digests/$arch.txt")"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            sources+=("$IMAGE@$digest")
          done
          mapfile -t names < <(jq -r '.tags[]' <<< "$METADATA")
          test "${#names[@]}" -gt 0
          tags=()
          for name in "${names[@]}"; do tags+=(--tag "$name"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${names[0]}" --raw | \
            jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]'
