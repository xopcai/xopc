# Publish @xopcai/xopc to npm and ghcr.io/xopcai/xopc when a version tag is pushed.
# npm uses Trusted Publishing (GitHub Actions OIDC); GHCR uses GITHUB_TOKEN.

name: npm Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      - name: Validate publish manifest
        run: pnpm run release:check-package

      - name: Resolve package version
        id: package
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${{ github.event_name }}" == "push" && "v${VERSION}" != "${{ github.ref_name }}" ]]; then
            echo "Package version ${VERSION} does not match release tag ${{ github.ref_name }}" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine npm tag
        id: npm-tag
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" == *"-beta"* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" == *"-dev"* ]] || [[ "$TAG_NAME" == *"-alpha"* ]]; then
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether version is already published
        id: npm-version
        shell: bash
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          if npm view "@xopcai/xopc@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@xopcai/xopc@${VERSION} is already published; publish will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm-version.outputs.exists != 'true'
        run: pnpm publish --no-git-checks --tag ${{ steps.npm-tag.outputs.tag }}

      - name: Confirm existing npm version
        if: steps.npm-version.outputs.exists == 'true'
        run: npm view "@xopcai/xopc@${{ steps.package.outputs.version }}" version dist.tarball

  docker:
    name: Publish Docker image
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: xopc:release-smoke
          cache-from: type=gha,scope=xopc-docker

      - name: Run Docker smoke test
        run: docker run --rm xopc:release-smoke xopc --version

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=xopc-docker
          cache-to: type=gha,mode=max,scope=xopc-docker
