# Build distributable Electron apps (electron-vite + electron-builder).
# Artifacts: dist/release/* per job (see scripts/electron-builder.pack.yml).
#
# If you previously had `.github/workflows/electron.yml` and see two "Electron Build" in Actions,
# the old workflow is orphaned after rename: disable it with:
#   gh api -X PUT repos/<owner>/<repo>/actions/workflows/<old-workflow-id>/disable
#
# Coverage (GitHub-hosted runners):
#   - macOS: Apple Silicon runner builds both Intel (x64) + arm64 in one job
#   - Windows: x64 + arm64 (separate runners; release job merges both `latest.yml` so auto-update works)
#   - Linux: x64 (AppImage+deb) + arm64 AppImage only on ubuntu-24.04-arm (deb/fpm on arm64 CI is unreliable).
#
# Triggers:
#   - workflow_dispatch (manual) — builds artifacts; optionally republishes them to `release_tag`
#   - git tag push: v* (e.g. v0.2.3) — builds + Release assets when every matrix job succeeds
#
# Private repos: arm64 Linux/Windows runners require available quota on your plan
# (see GitHub docs: “Standard GitHub-hosted runners for private repositories”).
#
# Optional secrets (macOS signing / notarization):
#   - CSC_LINK: base64/file URL certificate for electron-builder (macOS only)
#   - CSC_KEY_PASSWORD: password for that certificate
#   - APPLE_ID: Apple ID email for notarytool
#   - APPLE_APP_SPECIFIC_PASSWORD: app-specific password (appleid.apple.com), not your Apple ID password
#   - APPLE_TEAM_ID: 10-character Team ID (Membership details in developer.apple.com)
# Alternative notarization auth: APPLE_API_KEY (base64 .p8), APPLE_API_KEY_ID, APPLE_API_ISSUER
# Enable notarization in scripts/electron-builder.pack.yml: mac.notarize: true
#
# Optional secrets (Windows signing; enables signed Windows releases):
#   - WIN_CSC_LINK: base64/file URL for Windows Authenticode certificate
#   - WIN_CSC_KEY_PASSWORD: password for that certificate
#
# Inspect runs locally (after `gh auth login`):
#   ./scripts/gh-electron-build-runs.sh
#   gh run list --workflow=electron-build.yml --limit 15
#   gh run view <run-id> --log-failed
#
# Release uploads: use `gh` with per-file uploads + backoff to reduce GitHub REST secondary rate limits
# (bulk upload actions can burst the API and fail with "exceeded a secondary rate limit").

name: Electron Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing v* tag to create or replace release assets for
        required: false
        type: string
  push:
    tags:
      - 'v*'

# @vscode/ripgrep postinstall uses GITHUB_TOKEN for api.github.com (avoids 403 / rate limits on shared runners).
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read

concurrency:
  group: electron-build-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 host → produce Intel + Apple Silicon artifacts (dmg/zip per arch).
          - os: macos-latest
            artifact_name: macos-x64-arm64
            electron_builder_args: '--mac --x64 --arm64'
          - os: windows-latest
            artifact_name: windows-x64
            electron_builder_args: '--win --x64'
          - os: windows-11-arm
            artifact_name: windows-arm64
            electron_builder_args: '--win --arm64'
          - os: ubuntu-latest
            artifact_name: linux-x64
            electron_builder_args: '--linux --x64'
          - os: ubuntu-24.04-arm
            artifact_name: linux-arm64
            electron_builder_args: '--linux appimage --arm64'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build node + gateway web UI
        shell: bash
        # `build:web` → dist/gateway/static/root (required for gateway `/` and `/assets/*`; without it users see "UI not found").
        run: pnpm run build:ci

      - name: Verify gateway UI static files
        shell: bash
        run: test -f dist/gateway/static/root/index.html

      - name: Verify Chrome extension bridge artifacts
        shell: bash
        run: test -f dist/browser-ext/dist/background.js

      - name: Build Electron app
        shell: bash
        env:
          # Avoid hard-link issues on some Windows runners when packaging.
          USE_HARD_LINKS: false
          # Signing: only export CSC_* when BOTH secrets are set. Partial config (e.g. CSC_LINK
          # without CSC_KEY_PASSWORD) makes electron-builder attempt import and fail with
          # "empty password" and ".../xopc not a file" on the workspace path.
          # Windows must never fall back to generic CSC_* because macOS Developer ID
          # certificates can be Authenticode-applied to .exe files but fail updater trust checks.
          _EB_CSC_LINK: ${{ secrets.CSC_LINK }}
          _EB_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          _EB_WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          _EB_WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Notarization (used when mac.notarize is true in scripts/electron-builder.pack.yml)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "${{ matrix.os }}" == windows* ]]; then
            if [[ -n "${_EB_WIN_CSC_LINK:-}" && -n "${_EB_WIN_CSC_KEY_PASSWORD:-}" ]]; then
              export CSC_LINK="$_EB_WIN_CSC_LINK"
              export CSC_KEY_PASSWORD="$_EB_WIN_CSC_KEY_PASSWORD"
            else
              echo "⚠️ WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD not set; building unsigned Windows installer"
              unset CSC_LINK CSC_KEY_PASSWORD
              export CSC_IDENTITY_AUTO_DISCOVERY=false
            fi
          elif [[ -n "${_EB_CSC_LINK:-}" && -n "${_EB_CSC_KEY_PASSWORD:-}" ]]; then
            export CSC_LINK="$_EB_CSC_LINK"
            export CSC_KEY_PASSWORD="$_EB_CSC_KEY_PASSWORD"
          fi
          unset _EB_CSC_LINK _EB_CSC_KEY_PASSWORD _EB_WIN_CSC_LINK _EB_WIN_CSC_KEY_PASSWORD

          pnpm run electron:build:artifacts
          if find out/main/chunks -name '*validate-channel-configs*' 2>/dev/null | grep -q .; then
            echo "❌ Electron main bundle still includes validate-channel-configs chunk"
            exit 1
          fi
          if grep -E 'from["'\''](zod|pino|dotenv|electron-updater)["'\'']' out/main/index.js out/main/chunks/*.js 2>/dev/null; then
            echo "❌ Electron main bundle externalizes runtime npm deps (set main.build.externalizeDeps=false)"
            exit 1
          fi
          if [ ! -f out/server/schema.sql ]; then
            echo "❌ out/server/schema.sql missing (build-electron-server must copy SQLite DDL beside index.js)"
            exit 1
          fi
          if [ ! -d dist/electron/extensions ]; then
            echo "❌ dist/electron/extensions missing (electron:extensions:build must run before packaging)"
            exit 1
          fi
          # electron-builder.mjs hides pnpm workspace markers + verifies asar node_modules size on success.
          # macOS: build architectures sequentially to avoid DMG temp file conflicts
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            build_macos_arch() {
              local arch="$1"
              local attempt=1
              local max_attempts=3
              local log_file

              while (( attempt <= max_attempts )); do
                log_file="$(mktemp)"
                if node scripts/electron-builder.mjs --mac "--${arch}" 2>&1 | tee "$log_file"; then
                  rm -f "$log_file"
                  return 0
                fi

                if ! grep -Eqi '503 Slow Down|code: serviceUnavailable' "$log_file"; then
                  rm -f "$log_file"
                  return 1
                fi
                rm -f "$log_file"

                if (( attempt == max_attempts )); then
                  echo "❌ Apple notarization remained rate-limited after ${max_attempts} attempts"
                  return 1
                fi

                local delay_seconds=$((attempt * 30))
                echo "⚠️ Apple notarization upload was rate-limited; retrying ${arch} build in ${delay_seconds}s (attempt ${attempt}/${max_attempts})"
                sleep "$delay_seconds"
                ((attempt += 1))
              done
            }

            echo "Building macOS x64..."
            build_macos_arch x64
            echo "Building macOS arm64..."
            build_macos_arch arm64
          else
            node scripts/electron-builder.mjs ${{ matrix.electron_builder_args }}
          fi

      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking build artifacts..."
          if [ ! -d "dist/release" ]; then
            echo "❌ dist/release directory not found!"
            exit 1
          fi

          artifacts="$(bash scripts/list-electron-release-upload-files.sh dist/release || true)"
          if [ -z "$artifacts" ]; then
            echo "❌ No installable artifacts found in dist/release!"
            echo "Contents of dist/release:"
            find dist/release -type f
            exit 1
          fi

          artifact_count="$(echo "$artifacts" | wc -l | tr -d ' ')"
          echo "✅ Found ${artifact_count} publishable artifact(s):"
          echo "$artifacts"

          if [[ "${{ github.ref }}" == refs/tags/v* && "${{ matrix.os }}" == "macos-latest" ]]; then
            app_path="$(find dist/release -name 'xopc.app' -type d | head -n 1)"
            if [ -z "$app_path" ]; then
              echo "❌ macOS .app bundle not found for signature verification"
              exit 1
            fi
            codesign --verify --deep --strict "$app_path"
          fi

          if [[ "${{ github.ref }}" == refs/tags/v* && "${{ matrix.os }}" == windows* ]]; then
            exe_path="$(find dist/release -maxdepth 1 -name 'xopc-*.exe' -type f | head -n 1)"
            if [ -z "$exe_path" ]; then
              echo "❌ Windows installer not found for signature verification"
              exit 1
            fi
            XOPC_SIGN_VERIFY_EXE="$exe_path" powershell -NoProfile -Command '
              $s = Get-AuthenticodeSignature -LiteralPath $env:XOPC_SIGN_VERIFY_EXE
              $s | Format-List Status, StatusMessage, SignatureType, SignerCertificate
              if ($null -eq $s.SignerCertificate) {
                Write-Warning "Windows installer is not Authenticode signed; release will not support trusted Windows auto-update"
              } else {
                if ($s.Status -ne "Valid") { Write-Error "Invalid Windows installer signature: $($s.Status) - $($s.StatusMessage)"; exit 1 }
                $subject = [string] $s.SignerCertificate.Subject
                $issuer = [string] $s.SignerCertificate.Issuer
                if ($subject -match "Developer ID Application" -or $issuer -match "Apple") {
                  Write-Error "Windows installer was signed with a macOS Developer ID certificate: $subject / $issuer"
                  exit 1
                }
              }
              $updateConfigPath = "dist/release/win-unpacked/resources/app-update.yml"
              if (Test-Path -LiteralPath $updateConfigPath) {
                $updateConfig = Get-Content -LiteralPath $updateConfigPath -Raw
                if ($updateConfig -match "Developer ID Application" -or $updateConfig -match "Apple") {
                  Write-Error "Windows app-update.yml contains macOS publisher metadata"
                  exit 1
                }
              }
            '
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xopc-electron-${{ matrix.artifact_name }}
          path: dist/release
          if-no-files-found: error
          retention-days: 14

  # Runs only when all `package` matrix jobs succeed. If any platform fails, this job is skipped
  # (no partial GitHub Release).
  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: xopc-electron-*
          path: release-assets
          merge-multiple: false

      # Windows x64 and arm64 each emit `latest.yml`; upload basename collision would leave
      # only one manifest on the release and break electron-updater for the other arch.
      - name: Merge Windows Electron latest.yml
        run: ruby scripts/merge-windows-electron-latest-yml.rb release-assets

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          REPO="${{ github.repository }}"
          # See scripts/list-electron-release-upload-files.sh (excludes win-unpacked/xopc.exe).
          # Use process substitution + readarray fallback for bash < 4 (macOS uses bash 3.2).
          mapfile -t FILES < <(bash scripts/list-electron-release-upload-files.sh release-assets) 2>/dev/null || {
            mapfile_exit=$?
            if [ "$mapfile_exit" -eq 127 ]; then
              while IFS= read -r f; do
                FILES+=("$f")
              done < <(bash scripts/list-electron-release-upload-files.sh release-assets)
            else
              exit "$mapfile_exit"
            fi
          }
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No installable artifacts found under release-assets"
            exit 1
          fi
          echo "Publishing ${#FILES[@]} file(s) to release ${TAG}"

          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            for attempt in $(seq 1 8); do
              if gh release create "$TAG" --generate-notes --title "$TAG" --repo "$REPO"; then
                break
              fi
              echo "gh release create failed (attempt ${attempt})"
              if [ "$attempt" -eq 8 ]; then
                exit 1
              fi
              sleep $((45 + attempt * 15))
            done
          fi

          REMOTE_ASSETS="$(
            gh release view "$TAG" --repo "$REPO" --json assets \
              --jq '.assets[] | [.name, .size] | @tsv'
          )" || REMOTE_ASSETS=""

          for f in "${FILES[@]}"; do
            asset_name="$(basename "$f")"
            local_size="$(stat --format='%s' "$f")"
            remote_size="$(awk -F '\t' -v name="$asset_name" '$1 == name { print $2; exit }' <<< "$REMOTE_ASSETS")"
            if [ -n "$remote_size" ] && [ "$remote_size" = "$local_size" ]; then
              echo "Already uploaded: $f"
              continue
            fi

            for attempt in $(seq 1 8); do
              if gh release upload "$TAG" "$f" --clobber --repo "$REPO"; then
                echo "Uploaded: $f"
                break
              fi
              echo "Upload failed for $f (attempt ${attempt})"
              if [ "$attempt" -eq 8 ]; then
                exit 1
              fi
              sleep $((20 + attempt * 10))
            done
            sleep 12
          done

          # Older releases mistakenly uploaded win-unpacked/xopc.exe as release asset "xopc.exe".
          if gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -qx 'xopc.exe'; then
            echo "Removing misleading release asset xopc.exe (win-unpacked binary, not the NSIS installer)"
            gh release delete-asset "$TAG" xopc.exe --repo "$REPO" -y || true
          fi
