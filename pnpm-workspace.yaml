packages:
  - '.'
  - 'extensions/*'
  - 'packages/*'
  - 'web'

overrides:
  axios: ">=1.15.2"

allowBuilds:
  '@google/genai': true
  '@swc/core': true
  '@vscode/ripgrep': true
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: true

# Exempt recently-published @earendil-works/pi-* from minimumReleaseAge policy
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core@0.77.0'
  - '@earendil-works/pi-ai@0.77.0'
  - '@earendil-works/pi-coding-agent@0.77.0'
  - '@earendil-works/pi-tui@0.77.0'