packages:
  - '.'
  - 'extensions/*'
  - 'packages/*'
  - 'apps/*'
  - 'evals/*'
  - 'evals/*/apps/*'
  - 'evals/*/packages/*'
  - 'evals/*/packages/adapters/*'
  - 'web'

# Keep native Android build paths below CMake's Windows object path limit.
virtualStoreDir: .pnpm
virtualStoreDirMaxLength: 20

overrides:
  axios: ">=1.18.0"
  "brace-expansion@<1.1.16": "1.1.16"
  "brace-expansion@>=5.0.0 <5.0.9": "5.0.9"
  esbuild: ">=0.28.1"
  fast-uri: "3.1.5"
  form-data: "4.0.6"
  hono: "4.12.25"
  "ip-address@<=10.3.0": "10.3.1"
  js-yaml: "4.3.1"
  linkify-it: "5.0.2"
  "nanoid@<3.3.18": "3.3.18"
  prosemirror-model: "1.25.11"
  "postcss@<=8.5.17": "8.5.23"
  sharp: "0.35.3"
  "undici@>=7.0.0 <7.28.0": "7.28.0"
  "undici@>=8.0.0 <8.9.0": "8.9.0"
  "vite@<=6.4.2": "6.4.3"
  "vite@>=8.0.0 <=8.0.15": "8.0.16"

allowBuilds:
  '@google/genai': true
  '@swc/core': true
  '@vscode/ripgrep': true
  codebase-memory-mcp: true
  electron: true
  electron-winstaller: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: false

# Exempt recently-published @earendil-works/pi-* from minimumReleaseAge policy
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core'
  - '@earendil-works/pi-ai'
  - '@earendil-works/pi-coding-agent'
  - '@earendil-works/pi-tui'
  - app-builder-lib@26.15.3
  - builder-util-runtime@9.7.0
  - builder-util@26.15.3
  - dmg-builder@26.15.3
  - electron-builder-squirrel-windows@26.15.3
  - electron-builder@26.15.3
  - electron-publish@26.15.3

auditConfig:
  # The web console is a client-only SPA and does not use React Router RSC actions.
  ignoreGhsas:
    - GHSA-qwww-vcr4-c8h2
    # Metro is pinned to image-size 1.x; the advisory's patched 2.0.3 release is not published yet.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
