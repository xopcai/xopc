packages:
  - '.'
  - 'extensions/*'
  - 'packages/*'
  - 'apps/*'
  - 'web'

overrides:
  axios: ">=1.15.2"
  esbuild: ">=0.28.1"
  form-data: "4.0.6"
  hono: "4.12.25"
  "undici@>=7.0.0 <7.28.0": "7.28.0"
  "undici@>=8.0.0 <8.5.0": "8.5.0"
  "vite@<=6.4.2": "6.4.3"
  "vite@>=8.0.0 <=8.0.15": "8.0.16"

allowBuilds:
  '@google/genai': true
  '@swc/core': true
  '@vscode/ripgrep': true
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: true

# Exempt recently-published @earendil-works/pi-* from minimumReleaseAge policy
minimumReleaseAgeExclude:
  - '@earendil-works/pi-agent-core'
  - '@earendil-works/pi-ai'
  - '@earendil-works/pi-coding-agent'
  - '@earendil-works/pi-tui'
  - app-builder-lib@26.12.1
  - builder-util-runtime@9.6.2
  - builder-util@26.12.1
  - dmg-builder@26.12.1
  - electron-builder-squirrel-windows@26.12.1
  - electron-builder@26.12.1
  - electron-publish@26.12.1
