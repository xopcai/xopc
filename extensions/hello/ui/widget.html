<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello widget</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        color: var(--color-fg, #111);
        background: transparent;
        padding: 12px 16px;
      }
      .widget {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .icon {
        font-size: 1.25rem;
        line-height: 1;
      }
      .label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--color-fg-muted, #666);
      }
      .result {
        margin-top: 4px;
        font-size: 13px;
        line-height: 1.45;
        color: var(--color-fg, #111);
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div class="widget">
      <div class="icon" aria-hidden>👋</div>
      <div class="content">
        <div class="label">Hello Result (SDK)</div>
        <div class="result" id="result-text">Loading…</div>
      </div>
    </div>
    <script src="./widget.bundle.js"></script>
  </body>
</html>
